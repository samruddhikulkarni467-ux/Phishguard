<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 250px;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        h1 {
            font-size: 16px;
            color: #075e54;
        }
        p {
            font-size: 12px;
            color: #555;
        }
        .status {
            font-weight: bold;
            color: green;
        }
        .warning-list {
            font-size: 11px;
            background: #f9f9f9;
            padding: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>WhatsApp Fraud Detector</h1>
    <p>Status: <span class="status">Active</span></p>
    <p>This extension monitors your WhatsApp chats for suspicious links and warns you before you click.</p>
    <div class="warning-list">
        <strong>What we check:</strong>
        <ul>
            <li>Homograph attacks</li>
            <li>URL shorteners</li>
            <li>Suspicious TLDs (.xyz, .top, etc.)</li>
            <li>Scam keywords</li>
        </ul>
    </div>
    <p style="font-size: 10px; color: #888; margin-top: 10px;">Stay safe online!</p>
</body>
</html>
